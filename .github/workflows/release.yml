name: Release (Unsigned)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-latest
    env:
      XCODE_VERSION: "16.2"
      EXPECTED_MACOSX_DEPLOYMENT_TARGET: "13.0"
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: false # Skipping submodules as private scripts are not used in unsigned build

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Read version from VERSION.txt
        id: version
        run: |
          VERSION=$(cat VERSION.txt | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Tag version: v$VERSION"
      
      - name: Install XcodeGen and generate project
        run: |
          brew install xcodegen
          # Set VERSION and BUILD_NUMBER for XcodeGen
          export VERSION=${{ steps.version.outputs.version }}
          export BUILD_NUMBER=${{ github.run_number }}
          xcodegen generate

      - name: Build App
        run: |
          mkdir -p build dist
          
          # Build with ad-hoc signing (-) which counts as "unsigned" for distribution
          # but allows the build to complete without RegisterExecutionPolicyException
          xcodebuild -scheme DefaultTamer \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -arch arm64 \
            -arch x86_64 \
            MARKETING_VERSION=${{ steps.version.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

          # Copy app to a staging area
          mkdir -p build/staging
          ditto build/DerivedData/Build/Products/Release/DefaultTamer.app build/staging/DefaultTamer.app
          # Add a symlink to Applications for the DMG
          ln -s /Applications build/staging/Applications

      - name: Create DMG
        run: |
          DMG_PATH="dist/DefaultTamer-v${{ steps.version.outputs.version }}-unsigned.dmg"
          hdiutil create -volname "DefaultTamer ${{ steps.version.outputs.version }}" \
            -srcfolder build/staging \
            -ov -format UDZO \
            "$DMG_PATH"
          echo "dmg_path=$DMG_PATH" >> $GITHUB_ENV

      - name: Extract release notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk "/^## \\[$VERSION\\]/{found=1; next} found && /^## \\[/{exit} found{print}" \
            CHANGELOG.md > /tmp/release-notes.md || echo "No release notes found for $VERSION" > /tmp/release-notes.md
          sed -i '' '/./,$!d' /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.dmg_path }}
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update website release data
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DATE=$(date -u +%Y-%m-%d)
          DMG_NAME="DefaultTamer-v${VERSION}-unsigned.dmg"
          
          # Simplified update for unsigned build
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Update release.json
          jq -n \
            --arg version "${VERSION}" \
            --arg downloadUrl "/download/${DMG_NAME}" \
            --arg releaseDate "${DATE}" \
            --arg releaseNotesUrl "https://www.defaulttamer.app/release-notes" \
            --arg edSignature "UNSIGNED" \
            --argjson size 0 \
            '{version: $version, downloadUrl: $downloadUrl, releaseDate: $releaseDate, releaseNotesUrl: $releaseNotesUrl, edSignature: $edSignature, size: $size}' \
            > DefaultTamerWeb/src/data/release.json

          # Update CHANGELOG.md
          if ! grep -qF "## [$VERSION]" CHANGELOG.md; then
            perl -i -pe "s/## \[Unreleased\]/## [Unreleased]\n\n## [$VERSION] - $DATE/" CHANGELOG.md
          fi

          git add DefaultTamerWeb/src/data/release.json CHANGELOG.md
          git diff --staged --quiet || git commit -m "chore: update release data to v${VERSION} [skip ci]"
          git push origin unsigned-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
